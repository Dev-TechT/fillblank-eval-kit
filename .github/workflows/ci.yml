name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Run tests
        run: uv run --extra dev python -m pytest -q
      - name: Validate public datasets
        run: uv run python -m fillblank_eval.validator examples/public_sample.jsonl examples/public_dev.jsonl examples/public_top10_sample.jsonl
      - name: Duplicate and near-duplicate check
        run: uv run python -m fillblank_eval.duplicates examples/public_sample.jsonl examples/public_dev.jsonl examples/public_top10_sample.jsonl
      - name: Private-data leak scan
        run: uv run python -m fillblank_eval.leak_scan .
      - name: Public runner mock smoke
        run: uv run fillblank-run --dry-run --limit 3 --out-dir /tmp/fillblank-runner-ci-smoke
      - name: Inspect adapter import/list smoke
        run: uv run --with inspect-ai inspect list tasks adapters/inspect/fillblank_task.py
